<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>OwlPilot · Your academic co-pilot</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap');
    :root{--gold:#ffcf48;--green:#446549;--ink:#28312a;--muted:#7c8478;--line:#e5e9df;--bg:#f6f7f2}
    *{box-sizing:border-box}
    body{margin:0;font:14px 'DM Sans',sans-serif;color:var(--ink);background:var(--bg)}
    button,input,textarea,select{font:inherit}
    button{cursor:pointer;color:inherit}
    button:hover{filter:brightness(.96)}
    button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid #bd921c;outline-offset:3px}
    h1,h2,h3,p{margin:0}
    h1,h2,h3{font-family:Manrope,sans-serif}
    h1{font-size:30px;letter-spacing:-1.1px}
    h2{font-size:18px;letter-spacing:-.4px}
    h3{font-size:14px}
    p{line-height:1.65}
    small,.muted{color:var(--muted)}
    small{font-size:11px}
    aside{position:fixed;inset:0 auto 0 0;width:225px;background:white;border-right:1px solid var(--line);padding:29px 17px;display:flex;flex-direction:column}
    .brand{display:flex;align-items:center;gap:10px;padding:0 12px;font:800 24px Manrope}
    .logo{background:var(--gold);width:36px;height:38px;border-radius:9px;display:grid;place-items:center}
    .brand-sub{font-size:9px;letter-spacing:1.4px;color:#858c7e;padding:10px 12px 27px}
    .nav{border:0;background:none;padding:12px 14px;width:100%;display:flex;gap:13px;align-items:center;color:#737c6e;border-radius:7px;text-align:left;margin:2px 0;font-size:13px}
    .nav.active{background:#fff2c5;color:#292f23;font-weight:700}
    .ico{font-size:18px;width:20px}
    .nav-label{font-size:9px;letter-spacing:1.6px;color:#98a08e;padding:20px 14px 9px}
    .badge{background:#f2d16e;font-size:10px;border-radius:4px;padding:2px 6px;margin-left:auto}
    .sidebar-bottom{margin-top:auto;border-top:1px solid var(--line);padding:20px 10px 0}
    .dot{width:7px;height:7px;background:#6d9561;display:inline-block;border-radius:50%;margin-right:6px}
    .avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;background:#e8eddc}
    .row{display:flex;align-items:center;gap:12px}
    .between{justify-content:space-between}
    main{margin-left:225px}
    .topbar{height:74px;background:white;border-bottom:1px solid var(--line);padding:0 36px;display:flex;align-items:center;justify-content:space-between}
    .breadcrumb{font-size:12px;color:#7f8678}
    .mock{font-size:9px;letter-spacing:1px;border:1px solid var(--line);border-radius:4px;padding:5px 7px;color:#8d9486}
    .btn{border:1px solid #e0e5d8;border-radius:6px;background:white;padding:10px 14px;font-weight:600;font-size:12px;display:inline-flex;align-items:center;justify-content:center;gap:7px}
    .btn.primary{background:var(--gold);border-color:var(--gold)}
    .btn.dark{background:#304334;color:white;border-color:#304334}
    .btn.text{padding:3px 0;border:0;background:none;color:var(--green)}
    .content{max-width:1500px;padding:32px 36px 45px;margin:auto}
    .heading{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:25px}
    .eyebrow{font-size:10px;letter-spacing:1.5px;font-weight:700;color:#6b7f5a;text-transform:uppercase;margin-bottom:9px}
    .subtitle{color:var(--muted);font-size:12px;margin-top:7px}
    .hero{background:#eaf0e2;border:1px solid #dce5d3;border-radius:11px;padding:28px;display:flex;align-items:center;justify-content:space-between;gap:30px}
    .hero h2{font-size:22px;margin:10px 0}
    .hero p{color:#64725e;max-width:660px;font-size:13px}
    .hero-art{height:122px;min-width:122px;border-radius:50%;border:1px solid #c9d8bc;background:#f4f6eb;display:grid;place-items:center;font-size:57px;color:#647751;position:relative}
    .hero-art:after{content:'✦';position:absolute;right:0;top:0;font-size:27px;color:#a8b054}
    .chip{display:inline-block;padding:4px 7px;background:#eef3e9;color:#66805b;border-radius:4px;font-size:10px;font-weight:600}
    .chip.gold{background:#fff3ce;color:#977b34}
    .chip.red{background:#f8e9e2;color:#a1674d}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin:22px 0}
    .stat{padding:19px 20px;background:white;border:1px solid var(--line);border-radius:9px}
    .stat-label{font-size:11px;color:#818975;display:flex;justify-content:space-between}
    .stat strong{font:800 27px Manrope;display:inline-block;margin-top:9px}
    .stat small{font-size:10px;margin-left:7px}
    .progress{height:5px;background:#e8ecdf;border-radius:5px;margin-top:11px;overflow:hidden}
    .progress span{height:100%;display:block;background:#acbf95}
    .grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(290px,1fr);gap:22px}
    .stack{display:flex;flex-direction:column;gap:22px}
    .card{background:white;border:1px solid var(--line);border-radius:9px;overflow:hidden}
    .card-head{padding:20px 22px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
    .pad{padding:0 22px 22px}
    .todo{display:flex;gap:12px;align-items:flex-start;padding:16px 0;border-top:1px solid #edf0e7}
    .todo input{accent-color:var(--green);width:17px;height:17px;cursor:pointer;margin-top:2px}
    .todo:has(input:checked) strong{text-decoration:line-through;color:#929b88}
    .todo strong{font-size:12px;display:block;margin-bottom:5px}
    .time{font-size:10px;color:#929b87;margin-left:auto;white-space:nowrap}
    .due-row{display:flex;align-items:center;gap:12px;padding:15px 0;border-top:1px solid #edf0e7}
    .bar{width:4px;align-self:stretch;border-radius:4px;background:var(--course,#a4b38a)}
    .due-main{flex:1}
    .due-main strong{font-size:12px;display:block;margin-bottom:5px}
    .due-date{text-align:right;font-size:11px;white-space:nowrap}
    .course-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}
    .course-tile{border:1px solid var(--line);background:white;text-align:left;padding:17px;border-radius:8px;border-top:3px solid var(--course)}
    .course-tile:hover{transform:translateY(-2px);box-shadow:0 5px 15px #30402012}
    .course-tile h3{line-height:1.5;margin:10px 0;min-height:43px}
    .course-code{font-size:10px;font-weight:700;color:#728365;letter-spacing:.4px}
    .course-foot{display:flex;justify-content:space-between;align-items:center;padding-top:13px;margin-top:15px;border-top:1px solid var(--line)}
    .activity-row{display:flex;gap:12px;padding:12px 0}
    .activity-icon{height:27px;min-width:27px;border-radius:50%;background:#eff4e9;color:#789468;display:grid;place-items:center;font-size:12px}
    .activity-row p{font-size:12px}
    .activity-row small{font-size:10px}
    .approval-mini{border:1px solid #efdfb4;border-radius:8px;background:#fffaf0;padding:19px}
    .approval-mini p{font-size:12px;color:#918366;margin:8px 0 13px}
    .two{display:grid;grid-template-columns:1fr 1fr;gap:22px}
    .three{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
    .list-row{padding:17px 22px;border-top:1px solid var(--line)}
    .tabs{display:flex;overflow:auto;gap:7px;border-bottom:1px solid var(--line);margin:20px 0}
    .tab{background:none;border:0;border-bottom:2px solid transparent;padding:12px 16px;color:#838c79;white-space:nowrap}
    .tab.active{border-color:#d5b139;color:#30372c;font-weight:700}
    table{width:100%;border-collapse:collapse;font-size:12px;text-align:left}
    th{background:#f5f7ef;color:#7b8771;font-weight:500}
    th,td{padding:14px 17px;border-bottom:1px solid var(--line)}
    details{padding:17px 22px;border-top:1px solid var(--line)}
    summary{cursor:pointer;font-weight:600;font-size:12px}
    details p{margin-top:12px;font-size:13px}
    pre{white-space:pre-wrap;background:#f2f5ec;padding:15px;border-radius:6px;line-height:1.8;font-size:11px;color:#5b7452}
    .notice{font-size:12px;line-height:1.65;color:#8c7748;background:#fff8e5;border:1px solid #ede2bf;border-radius:7px;padding:13px 16px;margin:18px 0}
    .field{display:flex;flex-direction:column;gap:7px;font-size:12px;font-weight:600;margin-bottom:16px}
    input:not([type=checkbox]),select,textarea{width:100%;background:white;border:1px solid #dce3d3;border-radius:6px;padding:10px 12px;color:#34402e}
    textarea{min-height:80px;resize:vertical}
    .switch{appearance:none;width:34px;height:19px;border-radius:20px;background:#ccd4c2;cursor:pointer;position:relative}
    .switch:before{content:'';position:absolute;width:13px;height:13px;border-radius:50%;top:3px;left:3px;background:white}
    .switch:checked{background:#66885a}
    .switch:checked:before{left:18px}
    .calendar-wrap{overflow:auto}
    .calendar{display:grid;grid-template-columns:55px repeat(5,minmax(110px,1fr));min-width:660px}
    .day-head{text-align:center;border-bottom:1px solid var(--line);padding:13px;font-size:10px;color:#75816b}
    .day-head strong{display:block;font-size:20px;margin-top:5px;color:#3d4b32}
    .day-col{height:540px;position:relative;border-left:1px solid var(--line);background:repeating-linear-gradient(to bottom,transparent 0,transparent 59px,#edf0e7 59px,#edf0e7 60px)}
    .hours span{display:block;height:60px;font-size:9px;color:#8a977d;text-align:center;padding-top:4px}
    .event{position:absolute;left:5px;right:5px;border-left:3px solid #a0b387;border-radius:5px;background:#edf2e4;padding:7px;font-size:10px;line-height:1.5;overflow:hidden}
    .event strong{display:block;font-size:11px}
    .event.study{background:#fff9e6;border:1px dashed #d1bb76;color:#8f7f42}
    .event.blue{background:#eaf0f6;border-color:#91aac2}
    .event.purple{background:#f1ebf4;border-color:#b19bba}
    .legend{display:flex;gap:15px;font-size:10px;color:#809072}
    .footer{display:flex;justify-content:space-between;gap:20px;font-size:10px;color:#98a18e;margin-top:30px}
    .chat-drawer{position:fixed;right:0;top:0;bottom:0;width:420px;max-width:100%;background:white;box-shadow:-10px 0 60px #26362122;z-index:30;display:flex;flex-direction:column}
    .chat-head{padding:23px;border-bottom:1px solid var(--line)}
    .messages{padding:20px;flex:1;overflow:auto}
    .message{padding:14px;border-radius:8px;background:#f0f4e9;margin:12px 0;font-size:13px;line-height:1.7}
    .message.user{background:#fff2c9;margin-left:30px}
    .suggestion{border:1px solid var(--line);border-radius:6px;padding:11px;background:white;display:block;width:100%;text-align:left;font-size:12px;margin:8px 0}
    .chat-form{display:flex;gap:8px;padding:18px;border-top:1px solid var(--line)}
    .modal-back{position:fixed;inset:0;background:#21301866;display:grid;place-items:center;padding:20px;z-index:50}
    .modal{background:white;max-width:650px;width:100%;max-height:95vh;overflow:auto;border-radius:12px;padding:26px}
    .toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%);background:#354930;color:white;padding:14px 22px;border-radius:8px;box-shadow:0 5px 20px #0002;font-size:12px;z-index:60}
    .page{animation:appear .15s ease}
    @keyframes appear{from{opacity:.5;transform:translateY(4px)}to{opacity:1;transform:none}}
    @media(max-width:1100px){
      aside{width:195px}
      main{margin-left:195px}
      .content{padding:25px}
      .topbar{padding:0 25px}
      .hero-art{display:none}
      .course-grid{grid-template-columns:repeat(2,1fr)}
      .stat{padding:16px}
      .stats{gap:10px}
      .three{grid-template-columns:1fr}
    }
    @media(max-width:760px){
      aside{position:relative;width:100%;padding:16px}
      .brand-sub,.sidebar-bottom,.nav-label{display:none}
      nav{display:flex;overflow:auto;gap:5px;margin-top:14px}
      .nav{min-width:max-content;width:auto;padding:9px}
      .ico{display:none}
      main{margin:0}
      .topbar{height:58px;padding:0 16px}
      .mock{display:none}
      .content{padding:22px 16px}
      .grid,.two{grid-template-columns:1fr}
      .stats{grid-template-columns:1fr 1fr}
      .heading{align-items:flex-start}
      h1{font-size:25px}
      .hero{padding:21px}
      .course-grid{grid-template-columns:1fr 1fr}
      .heading>.btn{white-space:nowrap}
      .card{overflow:auto}
    }
  </style>
</head>
<body>
  <!-- Sidebar Navigation -->
  <aside>
    <div class="brand">
      <span class="logo">
        <svg width="26" height="25" viewBox="0 0 30 28" aria-hidden="true">
          <path d="M3 3L8 6Q15 2 22 6L27 3V17Q26 26 15 27Q4 26 3 17Z" fill="#303226"/>
          <circle cx="10" cy="13" r="5" fill="#ffcf48"/>
          <circle cx="20" cy="13" r="5" fill="#ffcf48"/>
          <circle cx="10" cy="13" r="2"/>
          <circle cx="20" cy="13" r="2"/>
          <path d="M12 19L15 23L18 19" fill="#ffcf48"/>
        </svg>
      </span>
      OwlPilot<span style="font-size:12px;color:#bea138">✦</span>
    </div>
    <div class="brand-sub">KENNESAW STATE UNIVERSITY</div>
    <nav id="nav"></nav>
    <div class="sidebar-bottom">
      <small><span class="dot"></span>All systems connected</small>
      <p style="font-size:10px;color:#99a18f;margin:5px 0 20px 13px">Last synced today at 9:00 AM</p>
      <div class="row">
        <div class="avatar">AK</div>
        <div>
          <strong style="font-size:12px">Aaryan Kapoor</strong>
          <p style="font-size:10px;color:#8f9982">Computer Science · Marietta</p>
        </div>
      </div>
    </div>
  </aside>

  <!-- Main Workspace -->
  <main>
    <header class="topbar">
      <div class="breadcrumb">My workspace <span style="padding:0 12px;color:#ccd2c3">/</span><span id="crumb">Overview</span></div>
      <div class="row">
        <span class="mock">MOCK · DATA IS FAKE</span>
        <button class="btn" onclick="openChat()">✦ &nbsp; Ask OwlPilot</button>
        <div class="avatar">AK</div>
      </div>
    </header>
    <div class="content" id="app"></div>
  </main>

  <!-- Dynamic Overlays -->
  <div id="overlay"></div>
  <div id="chat"></div>
  <div id="toasts" role="status" aria-live="polite"></div>

  <script>
    // Mock course dataset
    const courses=[
      ['SWE','SWE 3313','Software Engineering','Dr. Patel','MW 12:30–1:45','J-150','A',94.2,'#9aaf80',['Software process & lifecycle','Requirements engineering','Use cases & modeling'],'Python and external libraries are approved. Your team has an outline drafted. Ask before touching a team deliverable.','Include measurable acceptance criteria and a clearly scoped MVP in your requirements document.'],
      ['MATH','MATH 3260','Linear Algebra I','Dr. Nguyen','TR 9:30–10:45','Atrium 118','B+',88.5,'#b29aba',['1.1–1.2 · Systems & row reduction','1.3–1.5 · Vector equations','2.1–2.4 · Matrix operations & inverses'],'Show augmented matrices at every step. Check independence before claiming a basis; recheck signs in row operations.','Test 1 covers sections 1.1–2.4. Review problems are in Module 2.'],
      ['CS','CS 3503','Computer Organization & Architecture','Dr. Okafor','MW 10:00–11:15','J-201','A-',91,'#92aabe',['Number systems & two’s complement','Memory hierarchy','Cache organization'],'Starter files are downloaded. Practice signed integer ranges. Quiz 2 is listed Tuesday despite the MW meeting pattern.','Cache simulator starter files are posted. Read the interface contract first.'],
      ['AI','AI 3642','Artificial Intelligence','Dr. Kim','TR 2:00–3:15','Q-102','A',96,'#c5ad74',['Intelligent agents','Search & problem solving','Heuristics & evaluation'],'OwlPilot is your project concept. The proposal is drafting. A README skeleton repository is waiting for approval.','Define your problem, evaluation criteria, and a feasible data source in the proposal.'],
      ['HIST','HIST 2112','Survey of US History II','Dr. Alvarez','Online asynchronous','Online','A',97.5,'#bd9681',['Civil War aftermath','Reconstruction policy','Week 4 · End of Reconstruction'],'Compare 1850 and 1877 on a timeline. Weekly quizzes close Sunday. Never open timed assessments automatically.','The Reconstruction quiz is available. Complete the reading before you begin.']
    ].map(c=>Object.fromEntries(['id','code','name','prof','time','room','grade','score','color','modules','memory','announcement'].map((k,i)=>[k,c[i]])));

    const due=[
      ['HIST','Week 4 Quiz · Reconstruction','Sun, Sep 13','11:59 PM',2,'Open now','Quiz'],
      ['SWE','Requirements Doc (team)','Mon, Sep 14','11:59 PM',8,'Outline drafted','Assignment'],
      ['CS','Quiz 2 · Memory hierarchy','Tue, Sep 15','10:50 AM',5,'In class · verify date','Quiz'],
      ['CS','Assignment 2 · Cache simulator','Wed, Sep 16','11:59 PM',10,'Starter files pulled','Assignment'],
      ['MATH','HW Set 2 · Sections 2.1–2.4','Fri, Sep 18','9:30 AM',5,'Half done','Assignment'],
      ['MATH','Test 1 · Sections 1.1–2.4','Fri, Sep 18','9:30 AM',20,'Review guide ready','Exam'],
      ['AI','Final Project Proposal','Sat, Sep 19','11:59 PM',5,'Drafting','Assignment']
    ];

    const seeds=[
      ['MATH','Quiz 2','Q3',4,'Assumed vectors were a basis without checking independence.','Row-reduce the column matrix. Check independence and spanning.','Linear independence & basis'],
      ['MATH','Quiz 2','Q5',2,'Sign error swapping rows.','Exchange entire rows without negating entries. A row swap changes the determinant’s sign.','Row reduction'],
      ['CS','Quiz 1','Q7',3,'Said 8-bit two’s complement can represent +128.','The range is −2^(n−1) through 2^(n−1)−1: −128 to +127 for 8 bits.','Signed integer representation'],
      ['HIST','Practice W4','Q4',0,'Confused the Compromise of 1877 with 1850.','1877 is associated with the end of Reconstruction; 1850 addressed sectional conflict over slavery.','Reconstruction timeline']
    ];

    let saved={};
    try{saved=JSON.parse(localStorage.getItem('owlpilot-demo')||'{}')}catch(e){}
    let state={
      page:'home',
      course:'MATH',
      tab:'Announcements',
      week:0,
      review:'MATH',
      mistakes:saved.mistakes||seeds,
      approvals:saved.approvals||{},
      todos:saved.todos||{},
      jobs:saved.jobs||{},
      settings:saved.settings||{}
    };

    const $=s=>document.querySelector(s);
    const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const course=id=>courses.find(c=>c.id===id);

    function persist(){
      try{localStorage.setItem('owlpilot-demo',JSON.stringify(state))}catch(e){}
    }

    function toast(t){
      $('#toasts').innerHTML='<div class="toast">'+esc(t)+'</div>';
      setTimeout(()=>$('#toasts').innerHTML='',3500);
    }

    const navs=[
      ['home','⌂','Overview'],
      ['courses','▤','Courses'],
      ['calendar','▦','Calendar'],
      ['activity','◷','Assistant activity'],
      ['approvals','▣','Approvals'],
      ['mistakes','◇','Mistake log'],
      ['review','▧','Review guides'],
      ['degree','⌘','Degree planner'],
      ['rules','♧','Rules & boundaries'],
      ['settings','⚙','Settings']
    ];

    const pending=()=>2-Object.keys(state.approvals).length;

    function nav(){
      $('#nav').innerHTML=navs.map((n,i)=>(i===3?'<div class="nav-label">YOUR ASSISTANT</div>':i===8?'<div class="nav-label">PREFERENCES</div>':'')+`<button class="nav ${state.page===n[0]?'active':''}" onclick="go('${n[0]}')" ${state.page===n[0]?'aria-current="page"':''}><span class="ico">${n[1]}</span>${n[2]}${n[0]==='approvals'&&pending()?'<span class="badge">'+pending()+'</span>':''}</button>`).join('');
    }

    function go(p){
      state.page=p;
      nav();
      $('#crumb').textContent=navs.find(n=>n[0]===p)[2];
      render();
      window.scrollTo(0,0);
    }

    function heading(k,t,s,b=''){
      return `<div class="heading"><div><div class="eyebrow">${k}</div><h1>${t}</h1><p class="subtitle">${s}</p></div>${b}</div>`;
    }

    function dueRows(ds){
      return ds.map(d=>`<div class="due-row"><div class="bar" style="--course:${course(d[0]).color}"></div><div class="due-main"><strong>${d[1]}</strong><small>${course(d[0]).code} · ${d[4]}% of grade</small></div><div class="due-date">${d[2]}<br><small>${d[3]}</small></div></div>`).join('');
    }

    function tiles(){
      return courses.map(c=>`<button class="course-tile" style="--course:${c.color}" onclick="openCourse('${c.id}')"><div class="row between"><span class="course-code">${c.code}</span><span style="color:#97a189">↗</span></div><h3>${c.name}</h3><small>${c.prof}</small><div class="course-foot"><span class="chip">${c.grade} &nbsp; ${c.score.toFixed(1)}%</span><small>${due.filter(d=>d[0]===c.id).length} upcoming</small></div></button>`).join('');
    }

    function task(i,t,s,time){
      return `<label class="todo"><input type="checkbox" aria-label="Complete ${t}" ${state.todos[i]?'checked':''} onchange="state.todos[${i}]=this.checked;persist();document.getElementById('todo-count').textContent=Object.values(state.todos).filter(Boolean).length+' of 3 complete'"><div><strong>${t}</strong><small>${s}</small></div><span class="time">${time}</span></label>`;
    }

    function home(){

    }

    function degree(){
      return heading('A clear path to your next semester','Degree planner','B.S. Computer Science · Marietta · DegreeWorks snapshot today at 7:00 AM')+`<div class="hero"><div><div class="eyebrow">YOUR DEGREE JOURNEY</div><h2>71% complete. Keep building forward.</h2><p>Earliest estimated graduation: <strong>Spring 2028</strong> · Subject to availability and successful completion.</p><div class="progress"><span style="width:71%"></span></div></div><strong style="font:800 46px Manrope">71%</strong></div><div class="two" style="margin:22px 0"><section class="card"><div class="card-head"><h2>Remaining requirements</h2></div>${[['CS 3305','Ready'],['CS 4306','Needs CS 3305'],['CS 3502','Ready'],['CS 4720','Ready'],['MATH 3332','Ready'],['CS 4850','Needs CS 4306'],['Upper-division elective · 6 cr','Remaining']].map(r=>`<div class="list-row row between"><h3>${r[0]}</h3><span class="chip ${r[1]==='Ready'?'':'gold'}">${r[1]}</span></div>`).join('')}</section><section class="card"><div class="card-head"><h2>Draft verification</h2><span class="chip">5 checks passed · mock</span></div><div class="pad">${['CRNs open · all 5 sections have seats','No overlaps · meeting times checked','Prerequisites met · assumes in-progress courses pass','15 credits · five 3-credit courses','Constraints · 10 AM or later, Marietta, Fridays free'].map(s=>`<p style="padding:12px 0;border-bottom:1px solid var(--line);font-size:13px;color:#6e875d">✓ &nbsp; ${s}</p>`).join('')}<div class="notice">HIST 2112 also appears in Fall 2026. It is preserved in the supplied mock draft, but replace it if completed this fall. These checks do not validate duplicate-credit applicability.</div></div></section></div><section class="card"><div class="card-head"><div><h2>Spring 2027 · Draft schedule</h2><p class="subtitle">15 credits · 4 campus days · Fridays free</p></div><span class="chip gold">Advisory only</span></div>${gridCalendar(true)}<div class="list-row"><small>HIST 2112 · CRN 80412 · Online asynchronous · 3 credits</small></div>${table(['Course / CRN','Instructor','Meeting','Seats available'],[['CS 3305 / 81234','Dr. Chen','MW 10:00–11:15','18'],['CS 3502 / 81877','Dr. Reed','TR 11:00–12:15','<span class="chip gold">4 · limited</span>'],['MATH 3332 / 82110','Dr. Shah','MW 12:30–1:45','12'],['CS 4720 / 83321','Dr. Brooks','TR 2:00–3:15','9'],['HIST 2112 / 80412','Dr. Alvarez','Online','22']])}<div class="list-row"><p style="font-size:12px">This fictional schedule is advisory. Review your audit and register yourself in Owl Express. OwlPilot never registers you.</p></div></section>`;
    }

    function settings(){
      return heading('Your assistant, on your terms','Settings','Connections are simulated. Preferences are saved only in this browser.')+`<div class="two"><div class="stack"><section class="card"><div class="card-head"><h2>Connections</h2></div>${[['D2L Brightspace','Read-only CLI · 5 courses'],['DegreeWorks','Read-only CLI · audit & sections'],['Telegram','Briefs and approval notifications'],['Google Calendar','Calendar writes require approval']].map(c=>`<div class="list-row row between"><div><h3>${c[0]}</h3><p class="subtitle">${c[1]}</p></div><button class="btn" onclick="toast('${c[0]}: simulated connection healthy. No credentials stored.')"><span class="dot"></span>Connected</button></div>`).join('')}</section><section class="card"><div class="card-head"><h2>Local runtime</h2></div><div class="pad"><p>Python scheduler → Codex CLI (local)</p><label class="field" style="margin-top:15px">Model<select onchange="state.settings.model=this.value;persist();toast('Mock model preference saved.')"><option ${state.settings.model==='gpt-6'?'selected':''}>gpt-6</option><option ${state.settings.model==='gpt-5.6'?'selected':''}>gpt-5.6</option></select></label><small>Simulated model selection · No live agent is running.</small><p style="margin-top:17px"><button class="btn text" onclick="go('activity')">Manage scheduled jobs →</button></p></div></section></div><section class="card"><div class="card-head"><h2>Notifications & profile</h2></div><div class="pad"><form onsubmit="saveSettings(event)"><div class="two"><label class="field">Quiet hours start<input type="time" name="start" value="${esc(state.settings.start||'23:00')}"></label><label class="field">Quiet hours end<input type="time" name="end" value="${esc(state.settings.end||'07:00')}"></label></div><label class="field">Maximum pings per day<input name="pings" type="number" min="0" max="20" value="${esc(state.settings.pings??4)}"></label><label class="field">Campus<select name="campus"><option>Marietta only</option></select></label><label class="field">Earliest class<input type="time" name="earliest" value="${esc(state.settings.earliest||'10:00')}"></label><label class="row" style="margin:18px 0 22px"><input type="checkbox" name="friday" ${state.settings.friday===false?'':'checked'}> Keep Fridays free</label><button class="btn primary" type="submit">Save preferences</button><p class="subtitle">Constraints apply to future drafts. The supplied Spring schedule remains a fixed mock.</p></form></div></section></div>`;
    }

    function saveSettings(e){
      e.preventDefault();
      state.settings={...state.settings,...Object.fromEntries(new FormData(e.target)),friday:e.target.elements.friday.checked};
      persist();
      toast('Preferences saved in this browser.');
    }

    function render(){
      $('#app').innerHTML='<div class="page">'+({home,courses:coursePage,calendar:calendarPage,activity,approvals,rules,mistakes,review,degree,settings}[state.page])()+'</div><footer class="footer"><span>OwlPilot · A little support. Your work, always.</span><span>Fall 2026 · Local-first academic assistant</span></footer>';
    }

    // Reconstructed Chat Drawer & Simulated Responses
    let chatHistory=[],busy=false;

    function openChat(){
      $('#chat').innerHTML=`<section class="chat-drawer" aria-label="Ask OwlPilot"><div class="chat-head row between"><div><h2>✦ Ask OwlPilot</h2><p class="subtitle">Your courses. Your context.</p></div><button class="btn" aria-label="Close chat" onclick="closeChat()">✕</button></div><div class="messages" id="messages"><div class="message">Hi Aaryan. Let’s make your Friday count. Ask about your deadlines, Test 1 weak spots, or pending approvals.</div>${!chatHistory.length?`<button class="suggestion" onclick="ask('What should I focus on today?')">What should I focus on today?</button><button class="suggestion" onclick="ask('Help me prep for MATH Test 1')">Help me prep for MATH Test 1</button><button class="suggestion" onclick="ask('Write my SWE discussion post for me')">Write my SWE discussion post for me</button><button class="suggestion" onclick="ask('What needs my approval?')">What needs my approval?</button>`:''}${chatHistory.map(m=>`<div class="message ${m.role}">${esc(m.text)}</div>`).join('')}</div><form class="chat-form" onsubmit="sendChat(event)"><input id="chat-input" placeholder="Ask about courses, deadlines, or study plans…" required autocomplete="off"><button class="btn primary" type="submit" ${busy?'disabled':''}>Send</button></form></section>`;
      let box=$('#messages');
      if(box)box.scrollTop=box.scrollHeight;
      let inp=$('#chat-input');
      if(inp)inp.focus();
    }

    function closeChat(){$('#chat').innerHTML=''}

    function replyFor(q){
      let s=q.toLowerCase();
      if(/write|post|submit|do my|solve|quiz|discussion/.test(s)&&/swe|assignment|graded|discussion|quiz|homework/.test(s)){
        return 'Policy boundary: I cannot write or submit graded work, post to discussions, or open timed assessments. I can, however, build an outline checklist or generate ungraded practice questions for you.';
      }
      if(/math|test 1|linear|basis|row/.test(s)){
        return 'MATH 3260 Test 1 is listed for Fri, Sep 18 at 9:30 AM (20% of grade). Your mistake log highlights two priorities: checking linear independence before claiming a basis, and keeping entry signs intact during row swaps. Open Review guides for your 3-hour plan.';
      }
      if(/approv|pending|github|calendar/.test(s)){
        return pending()?`You have ${pending()} pending approval request(s): creating the ai-final-project README skeleton repo and adding a Thu, Sep 17 Test 1 review block. Head to Approvals to review exact payloads.`:'All pending approval requests have been handled in this demo.';
      }
      if(/focus|today|plan|due|deadline/.test(s)){
        return 'Today’s focus: 1) Review HIST 2112 Reconstruction notes (25 min, quiz closes Sun 11:59 PM), 2) Practice MATH 3260 independence & basis (60 min), 3) Check your SWE 3313 requirements outline (30 min, due Mon).';
      }
      return 'Mock assistant response: I checked your local course notes and deadlines. You have 7 upcoming items across 5 courses, and all read-only snapshots are up to date as of 9:00 AM.';
    }

    function ask(text){
      if(busy)return;
      chatHistory.push({role:'user',text});
      busy=true;
      openChat();
      setTimeout(()=>{
        chatHistory.push({role:'bot',text:replyFor(text)});
        busy=false;
        if($('#chat').innerHTML)openChat();
      },350);
    }

    function sendChat(e){
      e.preventDefault();
      let inp=$('#chat-input'),val=inp?inp.value.trim():'';
      if(!val)return;
      ask(val);
    }

    // Close modal or chat on Escape key
    document.addEventListener('keydown',e=>{
      if(e.key==='Escape'){closeModal();closeChat();}
    });

    // Initial boot
    nav();
    render();
  </script>
</body>
</html>
